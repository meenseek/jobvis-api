spring.application.name=jobvis-api
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.locations=classpath:db/migration
spring.jackson.deserialization.fail-on-null-for-primitives=true
spring.mvc.problemdetails.enabled=true

spring.datasource.url=${JOBVIS_DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/jobvis}
spring.datasource.username=${JOBVIS_DATABASE_USERNAME:jobvis}
spring.datasource.password=${JOBVIS_DATABASE_PASSWORD:jobvis-local}
spring.datasource.hikari.maximum-pool-size=${JOBVIS_DB_MAX_POOL_SIZE:10}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
server.forward-headers-strategy=${JOBVIS_FORWARD_HEADERS_STRATEGY:none}

jobvis.cors.allowed-origins=${JOBVIS_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
jobvis.auth.google-client-id=${JOBVIS_GOOGLE_CLIENT_ID:}
jobvis.auth.session-ttl=${JOBVIS_SESSION_TTL:PT168H}
jobvis.auth.challenge-ttl=${JOBVIS_LOGIN_CHALLENGE_TTL:PT5M}
jobvis.auth.rate-limit-window=${JOBVIS_LOGIN_RATE_LIMIT_WINDOW:PT10M}
jobvis.auth.rate-limit-per-ip=${JOBVIS_LOGIN_RATE_LIMIT_PER_IP:60}
jobvis.auth.rate-limit-max-clients=${JOBVIS_LOGIN_RATE_LIMIT_MAX_CLIENTS:20000}
jobvis.auth.max-outstanding-challenges=${JOBVIS_LOGIN_MAX_OUTSTANDING_CHALLENGES:10000}
jobvis.auth.cleanup-delay=${JOBVIS_AUTH_CLEANUP_DELAY:PT1H}
jobvis.crypto.key-base64=${JOBVIS_ENCRYPTION_KEY_BASE64:}
jobvis.connections.gmail-client-id=${JOBVIS_GMAIL_CLIENT_ID:}
jobvis.connections.gmail-client-secret=${JOBVIS_GMAIL_CLIENT_SECRET:}
jobvis.connections.google-calendar-client-id=${JOBVIS_GOOGLE_CALENDAR_CLIENT_ID:}
jobvis.connections.google-calendar-client-secret=${JOBVIS_GOOGLE_CALENDAR_CLIENT_SECRET:}
jobvis.connections.microsoft-client-id=${JOBVIS_MICROSOFT_CLIENT_ID:}
jobvis.connections.microsoft-client-secret=${JOBVIS_MICROSOFT_CLIENT_SECRET:}
jobvis.connections.allowed-redirect-uris=${JOBVIS_OAUTH_REDIRECT_URIS:http://localhost:3000/oauth/callback,http://127.0.0.1:3000/oauth/callback}
jobvis.connections.oauth-max-outstanding-per-user=${JOBVIS_OAUTH_MAX_OUTSTANDING_PER_USER:10}
jobvis.connections.oauth-start-rate-window=${JOBVIS_OAUTH_START_RATE_WINDOW:PT10M}
jobvis.connections.oauth-start-rate-per-user=${JOBVIS_OAUTH_START_RATE_PER_USER:30}
jobvis.connections.oauth-exchange-lease=${JOBVIS_OAUTH_EXCHANGE_LEASE:PT2M}
jobvis.connections.oauth-refresh-lease=${JOBVIS_OAUTH_REFRESH_LEASE:PT1M}
jobvis.connections.naver-validation-window=${JOBVIS_NAVER_VALIDATION_WINDOW:PT10M}
jobvis.connections.naver-validation-attempts=${JOBVIS_NAVER_VALIDATION_ATTEMPTS:5}
jobvis.connections.naver-validation-max-clients=${JOBVIS_NAVER_VALIDATION_MAX_CLIENTS:20000}
jobvis.connections.naver-validation-max-concurrent=${JOBVIS_NAVER_VALIDATION_MAX_CONCURRENT:4}
jobvis.external-http.connect-timeout=${JOBVIS_EXTERNAL_CONNECT_TIMEOUT:PT5S}
jobvis.external-http.read-timeout=${JOBVIS_EXTERNAL_READ_TIMEOUT:PT30S}
jobvis.import.max-messages=${JOBVIS_IMPORT_MAX_MESSAGES:2000}
jobvis.import.gmail-fetch-concurrency=${JOBVIS_GMAIL_FETCH_CONCURRENCY:4}
jobvis.import.worker-concurrency=${JOBVIS_IMPORT_WORKER_CONCURRENCY:2}
jobvis.import.worker-shutdown-grace=${JOBVIS_IMPORT_WORKER_SHUTDOWN_GRACE:PT20S}
jobvis.import.heartbeat-interval=${JOBVIS_IMPORT_HEARTBEAT_INTERVAL:PT20S}
jobvis.import.retention=${JOBVIS_IMPORT_RETENTION:PT720H}
jobvis.import.poll-delay=${JOBVIS_IMPORT_POLL_DELAY:PT5S}
jobvis.import.cleanup-delay=${JOBVIS_IMPORT_CLEANUP_DELAY:PT1H}
jobvis.import.monitor-delay=${JOBVIS_IMPORT_MONITOR_DELAY:PT1M}
jobvis.import.auto-complete-rollout=${JOBVIS_IMPORT_AUTO_COMPLETE_ROLLOUT:false}
jobvis.import.naver-reconciliation-enabled=${JOBVIS_NAVER_RECONCILIATION_ENABLED:false}
jobvis.import.naver-reconciliation-file=${JOBVIS_NAVER_RECONCILIATION_FILE:}

server.address=${JOBVIS_SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
