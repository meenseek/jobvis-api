      properties:
        mutationId: { type: string, format: uuid }
        expectedReviewRevision: { type: integer, format: int64, minimum: 0 }
    CompleteBulkReviewResponse:
      type: object
      additionalProperties: false
      required: [completedCount, needsReviewCount, reviewRevision]
      properties:
        completedCount: { type: integer, minimum: 0 }
        needsReviewCount: { type: integer, format: int64, minimum: 0 }
        reviewRevision: { type: integer, format: int64, minimum: 0 }
    ApplicationEmail:
      type: object
      additionalProperties: false
      required: [id, subject, sender, receivedAt, summary]
      properties:
        id: { type: string, format: uuid }
        subject: { type: string }
        sender: { type: string }
        receivedAt: { type: string, format: date-time }
        summary: { type: string }
    ApplicationActivity:
      type: object
      additionalProperties: false
      required: [id, type, title, description, occurredAt]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/ActivityType' }
        title: { type: string }
        description: { type: string }
        occurredAt: { type: string, format: date-time }
    ApplicationChange:
      type: object
      additionalProperties: false
      required: [id, title, description, occurredAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        occurredAt: { type: string, format: date-time }
    ApplicationSchedule:
      oneOf:
        - $ref: '#/components/schemas/AllDayApplicationSchedule'
        - $ref: '#/components/schemas/TimedApplicationSchedule'
    AllDayApplicationSchedule:
      type: object
      additionalProperties: false
      required: [id, applicationId, applicationVersion, version, scheduleType, action, allDay, date, scheduledAt, endsAt, timezone, location, description, completed, completedAt]
      properties:
        id: { type: string, format: uuid }
        applicationId: { type: string, format: uuid }
        applicationVersion: { type: integer, format: int64, minimum: 0 }
        version: { type: integer, format: int64, minimum: 0 }
        scheduleType: { $ref: '#/components/schemas/ScheduleType' }
        action: { type: string }
        allDay: { type: boolean, const: true }
        date: { type: string, format: date }
        scheduledAt: { type: 'null' }
        endsAt: { type: 'null' }
        timezone: { type: 'null' }
        location: { type: string }
        description: { type: string }
        completed: { type: boolean }
        completedAt: { type: [string, 'null'], format: date-time }
    TimedApplicationSchedule:
      type: object
      additionalProperties: false
      required: [id, applicationId, applicationVersion, version, scheduleType, action, allDay, date, scheduledAt, endsAt, timezone, location, description, completed, completedAt]
      properties:
        id: { type: string, format: uuid }
        applicationId: { type: string, format: uuid }
        applicationVersion: { type: integer, format: int64, minimum: 0 }
        version: { type: integer, format: int64, minimum: 0 }
        scheduleType: { $ref: '#/components/schemas/ScheduleType' }
        action: { type: string }
        allDay: { type: boolean, const: false }
        date: { type: 'null' }
        scheduledAt: { type: string, format: date-time }
        endsAt: { type: [string, 'null'], format: date-time }
        timezone: { type: string }
        location: { type: string }
        description: { type: string }
        completed: { type: boolean }
        completedAt: { type: [string, 'null'], format: date-time }
    EmailHistoryPage:
      type: object
      additionalProperties: false
