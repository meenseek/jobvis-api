        page: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1 }
        hasNext: { type: boolean }
        filteredCount: { type: integer, format: int64, minimum: 0 }
        totalCount: { type: integer, format: int64, minimum: 0 }
        needsReviewCount: { type: integer, format: int64, minimum: 0 }
        reviewRevision: { type: integer, format: int64, minimum: 0 }
    ApplicationCounts:
      type: object
      additionalProperties: false
      required: [totalCount]
      properties:
        totalCount: { type: integer, format: int64, minimum: 0 }
    CompleteBulkReviewRequest:
      type: object
