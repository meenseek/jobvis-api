        date: { type: string, format: date }
        briefing: { $ref: '#/components/schemas/HomeBriefing' }
        priorityItems: { type: array, maxItems: 5, items: { $ref: '#/components/schemas/HomePriorityItem' } }
        upcomingSchedules: { type: array, maxItems: 5, items: { $ref: '#/components/schemas/HomeUpcomingSchedule' } }
        activeApplications: { type: array, maxItems: 5, items: { $ref: '#/components/schemas/HomeActiveApplication' } }
    HomeBriefing:
      type: object
      additionalProperties: false
      required: [reason, count]
      properties:
        reason:
          type: string
          enum: [needsReview, openTask, upcomingSchedule, idle]
        count: { type: integer, format: int64, minimum: 0 }
    HomePriorityItem:
      type: object
      additionalProperties: false
      required: [applicationId, applicationVersion, company, position, reason, scheduleType, nextActionAt, canComplete]
      properties:
        applicationId: { type: string, format: uuid }
        applicationVersion: { type: integer, format: int64, minimum: 0 }
        company: { type: string }
        position: { type: string }
        reason:
          type: string
          enum: [needsReview, overdue, today]
        scheduleType:
          oneOf:
            - $ref: '#/components/schemas/ScheduleType'
            - type: 'null'
        nextActionAt: { type: [string, 'null'], format: date }
        canComplete: { type: boolean }
    HomeUpcomingSchedule:
      type: object
      additionalProperties: false
      required: [applicationId, company, position, scheduleType, date]
      properties:
        applicationId: { type: string, format: uuid }
        company: { type: string }
        position: { type: string }
        scheduleType: { $ref: '#/components/schemas/ScheduleType' }
        date: { type: string, format: date }
    HomeActiveApplication:
      type: object
      additionalProperties: false
      required: [applicationId, company, position, status, needsReview, nextActionAt, latestActivityTitle]
      properties:
        applicationId: { type: string, format: uuid }
        company: { type: string }
        position: { type: string }
        status: { $ref: '#/components/schemas/ApplicationStatus' }
        needsReview: { type: boolean }
        nextActionAt: { type: [string, 'null'], format: date }
        latestActivityTitle: { type: string }
    CalendarSchedulePage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CalendarScheduleItem' } }
    CalendarScheduleItem:
      type: object
      additionalProperties: false
      required: [applicationId, company, position, status, needsReview, title, date]
      properties:
        applicationId: { type: string, format: uuid }
        company: { type: string }
        position: { type: string }
        status: { $ref: '#/components/schemas/ApplicationStatus' }
        needsReview: { type: boolean }
        title: { type: string }
        date: { type: string, format: date }
    ApplicationAnalytics:
      type: object
      additionalProperties: false
      required: [from, to, total, screeningPassed, reachedInterview, offered, monthlyFlow, sourceCounts]
      properties:
        from: { type: [string, 'null'], format: date }
        to: { type: string, format: date }
        total: { type: integer, format: int64, minimum: 0 }
        screeningPassed: { type: integer, format: int64, minimum: 0 }
        reachedInterview: { type: integer, format: int64, minimum: 0 }
        offered: { type: integer, format: int64, minimum: 0 }
        monthlyFlow: { type: array, items: { $ref: '#/components/schemas/MonthlyFlow' } }
        sourceCounts:
          type: object
          additionalProperties: false
          description: Sparse counts keyed by the canonical application source type.
          properties:
            gmail: { type: integer, format: int64, minimum: 0 }
            naver: { type: integer, format: int64, minimum: 0 }
            outlook: { type: integer, format: int64, minimum: 0 }
            manual: { type: integer, format: int64, minimum: 0 }
            other: { type: integer, format: int64, minimum: 0 }
    MonthlyFlow:
      type: object
      additionalProperties: false
      required: [month, count]
      properties:
        month: { type: string, pattern: '^\d{4}-\d{2}$' }
        count: { type: integer, format: int64, minimum: 0 }
    RecentActivity:
      type: object
      additionalProperties: false
      required: [id, applicationId, company, position, type, title, description, occurredAt]
      properties:
        id: { type: string, format: uuid }
        applicationId: { type: string, format: uuid }
        company: { type: string }
        position: { type: string }
        type: { $ref: '#/components/schemas/ActivityType' }
        title: { type: string }
        description: { type: string }
        occurredAt: { type: string, format: date-time }
    CreateCalendarPreviewRequest:
      type: object
      additionalProperties: false
      required: [scheduleId, connectionId, idempotencyKey, expectedScheduleVersion]
      properties:
        scheduleId: { type: string, format: uuid }
        connectionId: { type: string, format: uuid }
        idempotencyKey: { type: string, format: uuid }
        expectedScheduleVersion: { type: integer, format: int64, minimum: 0 }
    ConfirmCalendarExportRequest:
      type: object
      additionalProperties: false
      required: [previewHash]
      properties:
        previewHash: { type: string, minLength: 1 }
    CalendarExport:
      type: object
      additionalProperties: false
      required: [id, scheduleId, connectionId, scheduleVersion, previewHash, title, startsAt, endsAt, timezone, location, description, status, providerEventId, errorCode, confirmedAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        scheduleId: { type: string, format: uuid }
        connectionId: { type: string, format: uuid }
        scheduleVersion: { type: integer, format: int64, minimum: 0 }
        previewHash: { type: string }
        title: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        timezone: { type: string }
        location: { type: string }
        description: { type: string }
        status: { type: string, enum: [previewed, confirming, confirmed, failed] }
        providerEventId: { type: [string, 'null'] }
        errorCode: { type: [string, 'null'] }
        confirmedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    ProblemDetail:
      type: object
      additionalProperties: true
      required: [title, status, detail]
      properties:
        type: { type: string, format: uri-reference, default: about:blank }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
