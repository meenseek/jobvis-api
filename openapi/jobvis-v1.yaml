        items: { type: array, items: { $ref: '#/components/schemas/ApplicationEmail' } }
        nextCursor: { type: [integer, 'null'], format: int64 }
        totalCount: { type: integer, format: int64, minimum: 0 }
    ActivityHistoryPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ApplicationActivity' } }
        nextCursor: { type: [integer, 'null'], format: int64 }
    ChangeHistoryPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor, totalCount]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ApplicationChange' } }
        nextCursor: { type: [integer, 'null'], format: int64 }
        totalCount: { type: integer, format: int64, minimum: 0 }
